<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Übungen, Raster</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* Werkzeug, nicht Teil der App: alle Übungen auf einen Blick, filterbar.
     Bearbeitet wird in der App unter "Alle Übungen", das Raster hier ist
     für den Überblick über den ganzen Pool auf einem breiten Schirm. */
  #app { display: block; padding: 0; }

  .bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { font-size: 18px; margin: 0 8px 0 0; }
  .bar label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); }
  .bar select {
    font: inherit; font-size: 13px;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px;
  }
  .bar a { margin-left: auto; font-size: 13px; color: var(--accent); }
  .count { font-size: 13px; color: var(--ink-soft); }

  .grid {
    display: grid; gap: 16px; padding: 20px 16px 60px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    align-items: start;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span {
    font: 11px/1.6 ui-monospace, "SF Mono", monospace;
    border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; color: var(--ink-soft);
  }
</style>
</head>
<body>
<main id="app">
  <div class="bar">
    <h1>Übungen</h1>
    <label>Slot <select id="f-slot"></select></label>
    <label>Gerät <select id="f-equipment"></select></label>
    <label>Position <select id="f-position"></select></label>
    <span class="count" id="count"></span>
    <a href="../">Zur App &rarr;</a>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script type="module">
  import { EXERCISES } from '../data/exercises.js'
  import { SLOTS } from '../data/slots.js'
  import { exerciseCard } from '../lib/library.js'

  const $ = (id) => document.getElementById(id)
  const FILTERS = [
    ['f-slot', 'slot', SLOTS.map((s) => [s.id, s.label])],
    ['f-equipment', 'equipment', null],
    ['f-position', 'position', null],
  ]

  for (const [id, key, fixed] of FILTERS) {
    const values = fixed ?? [...new Set(EXERCISES.map((e) => e[key]))].map((v) => [v, v])
    $(id).replaceChildren()
    for (const [value, label] of [['', 'alle'], ...values]) {
      const opt = document.createElement('option')
      opt.value = value
      opt.textContent = label
      $(id).append(opt)
    }
    $(id).addEventListener('change', paint)
  }

  function paint() {
    const list = EXERCISES.filter((e) => FILTERS.every(([id, key]) => !$(id).value || e[key] === $(id).value))
    $('count').textContent = `${list.length} von ${EXERCISES.length}`
    $('grid').replaceChildren()
    for (const exercise of list) {
      const node = exerciseCard(exercise)
      const tags = document.createElement('div')
      tags.className = 'tags'
      for (const text of [`d${exercise.difficulty}`, exercise.equipment, exercise.position, exercise.view, exercise.id]) {
        const tag = document.createElement('span')
        tag.textContent = text
        tags.append(tag)
      }
      node.append(tags)
      $('grid').append(node)
    }
  }
  paint()
</script>
</body>
</html>
