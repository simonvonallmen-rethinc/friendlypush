<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Zehn Minuten für eine bessere Haltung!">
<title>Friendly push</title>
<link rel="stylesheet" href="styles.css">

<!-- Als App installierbar: Manifest, Icons, und ein Service Worker, den
     app.js anmeldet. Die Farbe der Systemleiste folgt dem Modus. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- Beide Fassungen stehen hier, damit die Systemleiste schon vor dem ersten
     Skript stimmt. Wer in den Einstellungen einen Modus festlegt, lässt
     app.js das `media` der nicht gewählten auf `not all` setzen. -->
<meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)" data-mode="light">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" data-mode="dark">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<!-- Das Icon liegt randlos vor, ohne eigene runde Ecke: die schneidet das
     System selbst, und eine zweite darunter sähe wie eine erhabene Platte aus.
     `precomposed` hielt bis iOS 6 den Glanz fern, schadet seither nicht. Den
     Glanz von iOS 26 kann eine Web-App nicht abschalten. -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="assets/apple-touch-icon.png">
<!-- iOS liest kein Manifest. Was dort zählt, steht in diesen drei Zeilen. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="friendly push">
<meta name="mobile-web-app-capable" content="yes">

<!-- Vorschau, wenn der Link in einem Chat landet. Relative Pfade, weil der
     Host noch offen ist; nach dem Deploy gehören hier absolute hin. -->
<meta property="og:type" content="website">
<meta property="og:title" content="friendly push">
<meta property="og:description" content="Zehn Minuten gegen den Rundrücken. Dreimal die Woche, dann weitergeben.">
<meta property="og:image" content="assets/icon-512.png">
<meta name="twitter:card" content="summary">
<body>

<main id="app" aria-live="polite"></main>

<footer class="footer">
  Bei Schmerzen abbrechen. Kein medizinischer Rat.<br>
  Made with love and some help of AI.
</footer>

<!-- Eine neue Fassung wird angeboten, nicht untergeschoben: mitten in einer
     Einheit neu zu laden wäre ein Abbruch. -->
<div class="toast" data-slot="update" role="status" hidden>
  <span>Neue Fassung bereit.</span>
  <button class="btn btn-small btn-primary" data-action="reload">Neu laden</button>
</div>

<!-- Die beiden Wege, die jederzeit offen bleiben, auch wenn die App längst
     läuft: die Erklärung und die Einstellungen. Sie stehen oben rechts und
     sehen gleich aus, weil sie dasselbe sind: ein Nebenausgang. Im Training
     und auf der Erklärung selbst stehen sie nicht da, dort führen sie
     nirgends hin. -->
<div class="topbtns">
  <button class="helpbtn" data-action="settings-top" title="Einstellungen"
          aria-label="Einstellungen">
    <svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg>
  </button>
  <button class="helpbtn" data-action="help" title="So funktioniert friendly push"
          aria-label="So funktioniert friendly push">?</button>
</div>

<!-- ------------------------------------------------- Landing -->
<!-- Der Einstieg für alle, die die App noch nicht kennen, und ab dem
     Fragezeichen die Erklärung für alle anderen: was die App tut, wie sie
     bedient wird, was häufig gefragt wird, wie sie auf den Homescreen kommt.
     Darum steht hier alles und nicht nur das Nötigste. -->
<template id="screen-landing">
  <!-- Der Einstieg und gleichzeitig die Erklärung. Er ist in Bänder
       geschnitten: ein Thema pro Band, über die ganze Breite, abwechselnd
       getönt. Die Kante trennt, nicht der Abstand, und die Kopfzeile springt
       zu den drei Stellen, die man im Betrieb sucht. -->
  <section class="screen screen-landing">

    <!-- Die Kopfzeile klebt oben: auf einer Seite dieser Länge soll der Weg
         zurück nicht erst zurückgescrollt werden müssen. -->
    <div class="lp-navbar">
      <nav class="lp-nav">
        <!-- Das Zeichen ist zugleich der Weg zurück, wenn es ein Zurück gibt:
             beim ersten Besuch ist diese Seite der Anfang. Einen eigenen Pfeil
             trägt die Kopfzeile nicht mehr, app.js macht das Zeichen
             antippbar. -->
        <p class="eyebrow brand lp-brand" data-slot="brand">
          <img class="lp-logo" src="assets/icon.svg" alt="" aria-hidden="true">
          friendly push <span class="tag">beta</span>
        </p>
        <div class="lp-jump">
          <button class="linkbtn" data-action="jump" data-to="steps">So geht's</button>
          <button class="linkbtn" data-action="jump" data-to="faq">Fragen</button>
          <button class="linkbtn" data-action="jump" data-to="installblock">Installieren</button>
        </div>
        <!-- Die Kopfzeile führt in die App und nicht in eine Einheit: wer
             hier schon war, landet auf der Übersicht. Erst wer noch nichts
             auf dem Gerät hat, fängt direkt an. Der Knopf im Hero bleibt der
             Weg ins Training. -->
        <button class="btn btn-primary lp-navcta" data-action="enter">App Starten</button>
      </nav>
    </div>

    <header class="lp-band lp-band-hero">
      <div class="lp-inner lp-hero">
        <div class="lp-hero-text">
          <p class="note lp-badges">Kein Konto · Keine Daten · Gratis</p>
          <h1>Zehn Minuten gegen den Rundrücken.</h1>
          <p class="lp-claim">Sechs Übungen, dreimal die Woche. Danach gibst du einer
            Person den Push weiter. Das ist die ganze App.</p>
          <div class="lp-cta">
            <button class="btn btn-primary" data-action="start">Jetzt starten, 10 Minuten</button>
            <button class="btn btn-soft" data-action="install" hidden>Auf den Homescreen</button>
          </div>
        </div>

        <!-- Statt eines Bildes die App selbst, in einem Rahmen: ein
             Übungsscreen mit laufendem Timer. Kein Screenshot, sondern
             dieselben Bausteine und Farben, damit das Mockup nicht veraltet,
             wenn die App sich ändert. Bedienbar ist nichts davon.

             Dahinter steht gekippt ein zweites Gerät mit dem Abschluss: zwei
             Momente derselben Einheit, das Training und das Weitergeben. Es
             ist angeschnitten und reine Dekoration, darum ohne Beschriftung
             und auf schmalen Geräten gar nicht erst da. -->
        <div class="lp-phones">
          <div class="lp-phone lp-phone-back" aria-hidden="true">
            <div class="lp-phone-screen">
              <div class="lp-phone-head">
                <p class="eyebrow">🎉 Geschafft</p>
                <b>Heute schon erledigt.</b>
              </div>
              <p class="lp-phone-line">Jetzt gibst du den Push weiter. Ein Link an eine
                Person, das war es.</p>
              <div class="pair">
                <span class="peer" data-done data-you><b>✓</b><span>Du</span></span>
                <span class="pair-link"></span>
                <span class="peer" data-pending><b>·</b><span>Eine Person</span></span>
              </div>
              <div class="lp-phone-next">Eine Person motivieren</div>
              <div class="lp-phone-week">
                <i></i><i data-on></i><i></i><i></i>
              </div>
            </div>
          </div>
          <div class="lp-phone" role="img"
               aria-label="Die App während einer Übung: Halber Kniestand, der Timer läuft, 42 Sekunden übrig, vier von sechs Übungen.">
            <div class="lp-phone-screen" aria-hidden="true">
              <div class="lp-phone-head">
                <p class="eyebrow">Hüftbeuger</p>
                <b>Halber Kniestand</b>
              </div>
              <div class="lp-phone-figure">
                <img src="uebungen/hipflexor-halber-kniestand/illustration.svg" alt="">
              </div>
              <div class="lp-phone-bar">
                <div class="progress">
                  <i data-on></i><i data-on></i><i data-on></i><i data-now></i><i></i><i></i>
                </div>
                <div class="lp-phone-timer">
                  <span class="lp-phone-fill"></span>
                  <svg class="icon lp-phone-icon"><use href="#i-pause"></use></svg>
                  <span class="lp-phone-time">42</span>
                  <span class="lp-phone-note">Antippen zum Stoppen</span>
                </div>
                <div class="lp-phone-next"><span>4/6</span> Weiter</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Gleich nach dem Hero, bevor jemand mehr erwartet, als da ist: die
         App ist ein Versuch und sagt das selber. -->
    <section class="lp-band lp-band-soft">
      <div class="lp-inner">
        <!-- Dieselbe Marke wie an der Wortmarke: der Hinweis ist ein Stempel
             auf der Seite und keine Überschrift des Abschnitts. -->
        <p class="eyebrow"><span class="tag">Beta</span></p>
        <h2>Aktuell ist alles im Aufbau.</h2>
        <p class="lead">Die Idee steht. Alles andere ist noch experimentell und
          kann sich jeden Tag ändern. Die Übungen sind bisher Platzhalter und
          werden später verfeinert, ergänzt oder ersetzt. Stay tuned!</p>
      </div>
    </section>

    <!-- Der Kern, direkt danach: er ist der Grund, warum es die App gibt,
         nicht eine Eigenschaft unter anderen. -->
    <section class="lp-band lp-band-teal">
      <div class="lp-inner">
        <h2>Der friendly push.</h2>
        <div class="pair" data-slot="pair"></div>
        <p class="lead">Du trainierst, du schickst einer Person einen Link. Es kommt
          nichts zurück und es gibt nichts abzuschliessen. Keine Gruppe, keine
          Rangliste, keine Erinnerung, die dich schlecht fühlen lässt. Nur eine
          Person, die du an dem Tag mitziehst.</p>
      </div>
    </section>

    <section class="lp-band lp-band-soft">
      <div class="lp-inner">
        <h2>Drei Dinge, die hier fehlen.</h2>
        <!-- Pro Karte ein Icon. Die Dateien in assets/ sind Platzhalter im
             Rahmen 96x96, zum Austauschen gegen die Zeichnungen aus Figma. -->
        <div class="lp-facts">
          <div>
            <img class="lp-fact-icon" src="assets/lp-fact-konto.svg" alt="" aria-hidden="true">
            <b>Kein Konto.</b><span>Nichts anzumelden, nichts zu bestätigen.
            Aufmachen und loslegen.</span>
          </div>
          <div>
            <img class="lp-fact-icon" src="assets/lp-fact-daten.svg" alt="" aria-hidden="true">
            <b>Keine Daten.</b><span>Dein Verlauf bleibt auf dem Gerät. Kein
            Server, keine Analytics, keine Fonts von aussen.</span>
          </div>
          <div>
            <img class="lp-fact-icon" src="assets/lp-fact-kosten.svg" alt="" aria-hidden="true">
            <b>Keine Kosten.</b><span>Keine Werbung, kein Abo, nichts, was
            später freigeschaltet werden will.</span>
          </div>
        </div>
      </div>
    </section>

    <section class="lp-band lp-band-brick">
      <div class="lp-inner lp-side">
        <img class="lp-side-icon" src="assets/lp-warum.svg" alt="" aria-hidden="true">
        <div class="lp-side-text">
          <p class="eyebrow">Warum</p>
          <h2>Acht Stunden am Pult hinterlassen Spuren.</h2>
          <p class="lead">Rundrücken, vorgezogene Schultern, ein vorgekipptes Becken.
            Nichts davon kommt über Nacht, und nichts davon geht über Nacht weg. Es
            braucht eine Gewohnheit, kein Programm. Zehn Minuten sind kurz genug,
            dass man sie wirklich macht.</p>
        </div>
      </div>
    </section>

    <section class="lp-band lp-band-soft" data-slot="steps">
      <div class="lp-inner">
        <p class="eyebrow">So geht's</p>
        <h2>Drei Schritte, so einfach.</h2>
        <ol class="steps">
          <li><span>
            <b>10 Minuten Zeit nehmen, das geht immer!</b>
            Kein Umziehen, kein Gerät, keine Vorbereitung. Zwischen zwei
            Terminen reicht es.
          </span></li>
          <li><span>
            <b>Übungen machen.</b>
            Sechs Stück, eine pro Bildschirm, Ansage dazu, Timer auf Tipp. Du
            legst das Handy hin und machst mit.
          </span></li>
          <li><span>
            <b>Eine Person motivieren.</b>
            Ein Link an jemanden deiner Wahl. Mehr ist es nicht: wer mitmacht,
            gibt den Push beim nächsten Mal selber weiter.
          </span></li>
        </ol>
      </div>
    </section>

    <section class="lp-band lp-band-plum" data-slot="installblock">
      <!-- Das Bild steht links, der Text behält seine Spalte daneben. Auf dem
           Handy fehlt die Breite dafür, dort steht das Bild darüber. -->
      <div class="lp-inner lp-side">
        <img class="lp-side-icon" src="assets/lp-install.svg" alt="" aria-hidden="true">
        <div class="lp-side-text">
          <p class="eyebrow">Installieren</p>
          <h2>Wie eine App, ohne App Store.</h2>
          <p class="lead" data-slot="installhow"></p>
          <div class="lp-cta">
            <button class="btn btn-primary" data-action="install" hidden>Auf den Homescreen legen</button>
          </div>
        </div>
      </div>
    </section>

    <section class="lp-band" data-slot="faq">
      <div class="lp-inner">
        <p class="eyebrow">Fragen</p>
        <h2>Was sonst noch gefragt wird.</h2>
        <div class="faq">
          <details>
            <summary>Wo liegen meine Daten?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Im Speicher deines Browsers, auf diesem Gerät, als ein einziger
              Eintrag. Es gibt keinen Server, der etwas davon sieht. Löschst du
              die Browserdaten oder die installierte App, ist der Verlauf weg.
              Ansehen und löschen kannst du alles hier oder in den
              Einstellungen.</p>
            <div class="wipe" data-slot="wipe"></div>
          </details>
          <details>
            <summary>Was steckt in dem Link, den ich schicke?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Dein Vorname und die sechs Übungen von heute, codiert im Link
              selbst. Wer ihn öffnet, sieht, dass du trainiert hast, und bekommt
              dieselbe Einheit angeboten. Es wird nichts gespeichert und es kommt
              nichts zurück.</p>
          </details>
          <details>
            <summary>Funktioniert sie offline?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Ja, nach dem ersten Laden. Die Zeichnungen aller Übungen holt die
              App im Hintergrund dazu, nicht nur die der heutigen Einheit. Im Zug
              ohne Empfang läuft die Einheit darum genauso.</p>
          </details>
          <details>
            <summary>Wie kommt eine neue Fassung zu mir?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Von selbst. Liegt eine bereit, meldet sich oben «Neue Fassung
              bereit», und du lädst neu, wenn es dir passt. Mitten in einer
              Einheit wird nichts untergeschoben.</p>
          </details>
          <details>
            <summary>Muss es wirklich dreimal die Woche sein?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Drei Einheiten von Montag bis Sonntag sind das Ziel. Eine Einheit
              pro Tag zählt. Es gibt keine Erinnerung, keine Benachrichtigung und
              nichts, was einen verpassten Tag nachträgt.</p>
          </details>
          <details>
            <summary>Was, wenn ich eine Übung nicht machen kann?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Überspringen, oben rechts. Wer gar nicht auf den Boden mag, stellt
              vor dem Start auf «Nur im Stehen» um. Für einzelne Bereiche gibt es
              noch keine Übung im Stehen, dort bleibt es am Boden.</p>
          </details>
          <details>
            <summary>Ist das medizinischer Rat?
              <svg class="icon faq-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <p>Nein. Sechs Übungen gegen die Folgen vom Sitzen, nicht mehr. Bei
              Schmerzen abbrechen, bei anhaltenden Beschwerden zu jemandem gehen,
              der dich anschauen kann.</p>
          </details>
        </div>
      </div>
    </section>

    <section class="lp-band lp-band-teal">
      <div class="lp-inner lp-side lp-final">
        <img class="lp-side-icon" src="assets/lp-final.svg" alt="" aria-hidden="true">
        <div class="lp-side-text">
          <h2>Zehn Minuten. Jetzt.</h2>
          <div class="lp-cta">
            <button class="btn btn-primary" data-action="start">Einheit starten</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Zum Schluss, wo es niemanden aufhält: der Code. Eine App, die damit
         wirbt, dass nichts das Gerät verlässt, soll zeigen lassen, dass das
         stimmt. -->
    <section class="lp-band lp-band-soft">
      <div class="lp-inner">
        <p class="eyebrow">Open Source</p>
        <h2>Der Code liegt offen.</h2>
        <p class="lead">Kein Backend, kein Konto, nichts Verstecktes: alles, was
          die App tut, steht in ein paar Dateien auf GitHub. Ansehen,
          nachrechnen, selber bauen.</p>
        <div class="lp-cta">
          <a class="btn btn-soft" href="https://github.com/simonvonallmen-rethinc/friendlypush"
             target="_blank" rel="noopener">Auf GitHub ansehen</a>
        </div>
      </div>
    </section>

  </section>
</template>

<!-- ------------------------------------------------- Einladung -->
<template id="screen-invite">
  <section class="screen">
    <p class="eyebrow brand">friendly push <span class="tag">beta</span></p>
    <h1 data-slot="headline"></h1>
    <div class="pair" data-slot="pair"></div>
    <p class="lead" data-slot="lead"></p>
    <div class="prefs" data-slot="prefs"></div>
    <button class="btn btn-primary" data-action="start" data-slot="startbtn">Mitmachen, 10 Minuten</button>
    <button class="btn btn-quiet" data-action="start-own" data-slot="startown" hidden>Lieber mein eigenes Set</button>
    <p class="note">Sechs Übungen gegen Rundrücken, vorgezogene Schultern und ein vorgekipptes Becken.</p>
  </section>
</template>

<!-- ------------------------------------------------------- Vor dem Start -->
<template id="screen-ready">
  <!-- Derselbe Aufbau wie eine Übung: Kopf, Fläche, Knöpfe unten. Die Figur
       steht damit schon hier an der Stelle und in der Grösse, an der sie
       gleich die ganze Einheit über steht. -->
  <section class="screen screen-ready">
    <div class="ex-body">
      <header class="ex-head">
        <div class="ex-head-text">
          <p class="eyebrow">🚀</p>
          <h1 data-slot="headline">Ready?</h1>
        </div>
      </header>

      <div class="ex-main">
        <div class="ex-figure" data-illu>
          <img class="ex-illu" src="uebungen/_app/ready.svg" alt="" aria-hidden="true">
        </div>
        <p class="lead" data-slot="lead"></p>
      </div>
    </div>

    <div class="ready-actions">
      <button class="btn btn-primary" data-action="go">Training starten</button>
      <button class="btn btn-quiet" data-action="cancel">Abbrechen</button>
    </div>
  </section>
</template>

<!-- ------------------------------------------------- Einstieg ohne Link -->
<template id="screen-home">
  <!-- Die Startseite ist in Bänder geschnitten wie die Erklärung: ein Thema
       pro Band, über die ganze Breite, die Kante trennt und nicht der
       Abstand. Oben die Lage, dann der Start, unten die Daten. -->
  <section class="screen screen-home">

    <!-- Dieselbe Kopfzeile wie die Erklärung: Marke, daneben die zwei
         Nebenausgänge als Zahnrad und Fragezeichen. Dieselben zwei Zeichen
         wie in der schwebenden Leiste, nur haben sie hier einen festen Platz
         statt über dem Inhalt zu liegen; die Leiste bleibt darum weg. -->
    <div class="lp-navbar">
      <nav class="lp-nav">
        <p class="eyebrow brand lp-brand">
          <img class="lp-logo" src="assets/icon.svg" alt="" aria-hidden="true">
          friendly push <span class="tag">beta</span>
        </p>
        <div class="lp-navbtns">
          <button class="helpbtn" data-action="settings-top" title="Einstellungen"
                  aria-label="Einstellungen">
            <svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg>
          </button>
          <button class="helpbtn" data-action="help" title="So funktioniert friendly push"
                  aria-label="So funktioniert friendly push">?</button>
        </div>
      </nav>
    </div>

    <!-- Lage: wer du bist, wie die Woche steht, welche Geste offen ist. -->
    <div class="lp-band lp-band-hero">
      <div class="lp-inner">
        <h1 data-slot="headline">Zehn Minuten für deinen Rücken</h1>

        <div class="intro" data-slot="intro" hidden>
          <ol class="steps">
            <li><span>
              <b>Zehn Minuten, sechs Übungen.</b>
              Gegen Rundrücken, vorgezogene Schultern und ein vorgekipptes Becken.
            </span></li>
            <li><span>
              <b>Dreimal die Woche.</b>
              Mehr braucht es nicht. Was du geschafft hast, merkt sich die App von selbst.
            </span></li>
            <li><span>
              <b>Danach motivierst du eine Person.</b>
              Ein Link an jemanden deiner Wahl. Mehr ist es nicht: wer mitmacht, gibt den
              Push beim nächsten Mal selber weiter.
            </span></li>
          </ol>
          <div class="pair" data-slot="demo"></div>
        </div>

        <div class="week" data-slot="week" data-hide-on-intro role="img" data-label=""></div>
        <p class="weekline" data-slot="weekline" data-hide-on-intro></p>
        <!-- Das Wochenziel ist eine Untergrenze, keine Obergrenze. Das steht
             direkt an der Zahl, sonst liest sie sich wie ein Soll. -->
        <p class="note weekmore" data-slot="weekmore" data-hide-on-intro></p>

        <!-- Die offene Geste gehört zur Lage, darum steht sie als Karte in
             diesem Band. Sie ist ein Hinweis und keine Aufgabe: das Kreuz
             räumt sie weg. -->
        <div class="pushcard" data-slot="pushcard" hidden>
          <button class="linkbtn pushcard-hide" data-action="pushcard-hide"
                  aria-label="Hinweis entfernen" title="Entfernen">
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
          </button>
          <div class="pair" data-slot="pushpair"></div>
          <p data-slot="pushnote"></p>
        </div>
      </div>
    </div>

    <!-- Der Start, mit der Frage davor und dem Weg in die Übungsliste: alles,
         was zum Trainieren gehört, steht in einem Band. -->
    <div class="lp-band lp-band-green">
      <div class="lp-inner">
        <div class="prefs" data-slot="prefs"></div>
        <button class="btn btn-primary" data-action="start" data-slot="startbtn">Einheit starten</button>
        <p class="note" data-slot="resume" hidden></p>
        <button class="btn btn-quiet" data-action="library">Alle Übungen ansehen</button>
      </div>
    </div>

  </section>
</template>

<!-- ------------------------------------------------- Einstellungen -->
<!-- Drei Dinge, die zur Person gehören und nicht zur Einheit: wie sie heisst,
     wie gross sie liest, wie hell sie es mag. Alles greift sofort, es gibt
     nichts zu speichern und nichts zu bestätigen. -->
<template id="screen-settings">
  <section class="screen screen-settings">
    <div class="topbar">
      <button class="linkbtn linkbtn-lead" data-action="back">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        Zurück
      </button>
    </div>
    <h1>Einstellungen</h1>

    <div class="setting">
      <label class="setting-label" for="set-name">Dein Vorname</label>
      <input class="field" id="set-name" type="text" maxlength="20"
             autocomplete="given-name" enterkeyhint="done" placeholder="Vorname"
             data-slot="name">
      <p class="note">Steht in dem Link, den du weitergibst, damit die andere
        Person sieht, von wem der Push kommt. Weiter kommt er nicht.</p>
    </div>

    <div class="setting">
      <p class="setting-label" id="set-font-label">Schriftgrösse</p>
      <div class="chips" data-slot="font" role="group" aria-labelledby="set-font-label"></div>
    </div>

    <div class="setting">
      <p class="setting-label" id="set-theme-label">Erscheinungsbild</p>
      <div class="chips" data-slot="theme" role="group" aria-labelledby="set-theme-label"></div>
      <p class="note" data-slot="themenote"></p>
    </div>

    <!-- Die App sagt an jeder Ecke, dass nichts das Gerät verlässt. Dann soll
         man auch nachsehen können, was da liegt: erst in Worten, darunter der
         Eintrag, wie er wirklich im Speicher steht. Gelöscht wird an
         derselben Stelle, an der man es gesehen hat. -->
    <div class="setting">
      <p class="setting-label" id="set-data-label">Daten</p>
      <p class="note">Alles, was friendly push über dich weiss, liegt in einem
        einzigen Eintrag im Speicher dieses Browsers. Es gibt keinen Server,
        der etwas davon sieht.</p>
      <details class="disclose">
        <summary aria-describedby="set-data-label">Ansehen, was gespeichert ist
          <svg class="icon disclose-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
        </summary>
        <div class="disclose-body">
          <dl class="datalist" data-slot="data"></dl>
          <details class="disclose disclose-inner">
            <summary>Der Eintrag selbst
              <svg class="icon disclose-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
            </summary>
            <div class="disclose-body">
              <pre class="dataraw" data-slot="raw"></pre>
            </div>
          </details>
        </div>
      </details>
      <div class="wipe" data-slot="wipe"></div>
    </div>
  </section>
</template>

<!-- ------------------------------------------------- Übung -->
<template id="screen-exercise">
  <section class="screen screen-exercise">
    <div class="ex-body">
      <header class="ex-head">
        <div class="ex-head-text">
          <p class="eyebrow" data-slot="slot"></p>
          <h1 data-slot="name"></h1>
          <!-- Woran man die Übung erkennt, bevor man anfängt: Lage und
               Hilfsmittel. -->
          <p class="ex-attrs" data-slot="attrs"></p>
        </div>
        <!-- Überspringen gehört zum Kopf der Übung, nicht zur Daumenleiste. -->
        <button class="linkbtn ex-skip" data-action="skip" aria-label="Übung überspringen" title="Überspringen">
          <svg class="icon" aria-hidden="true"><use href="#i-skip"></use></svg>
        </button>
      </header>

      <div class="ex-main">
        <div class="ex-figure" data-slot="figure"></div>
        <!-- Die Anleitung ist eine Schublade: auf niedrigen Screens zu, damit
             die Figur den Platz hat. Aufgeklappt schrumpft die Figur, der
             Screen wird nicht länger: lesen soll kein Scrollen kosten. -->
        <div class="ex-cue" data-slot="drawer">
          <button class="ex-cue-toggle" data-action="cue"
                  aria-expanded="false" aria-controls="ex-cue-text">
            <span>Anleitung</span>
            <svg class="icon ex-cue-caret" aria-hidden="true"><use href="#i-caret"></use></svg>
          </button>
          <div class="ex-cue-body">
            <p class="cue" id="ex-cue-text" data-slot="cue"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Alles Bedienbare sitzt unten am Daumen, der Rest scrollt darüber. -->
    <div class="ex-bar">
      <div class="ex-bar-top">
        <div class="progress" data-slot="progress" role="img" data-label=""></div>
      </div>
      <!-- Die Dosis steht auf einer eigenen Zeile über den Schritten: Zeit läuft
           und ist antippbar, Wiederholungen sind nur eine Angabe. -->
      <div class="ex-dose">
        <button class="timer" data-action="timer" aria-live="off" hidden>
          <span class="timer-fill" aria-hidden="true"></span>
          <svg class="icon timer-icon" aria-hidden="true"><use data-slot="timericon" href="#i-play"></use></svg>
          <span class="timer-label" data-slot="timer"></span>
          <span class="timer-note" data-slot="timernote"></span>
        </button>
        <p class="reps" data-slot="reps" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-repeat"></use></svg>
          <span class="reps-count" data-slot="repscount"></span>
          <span class="reps-note">Wiederholungen</span>
        </p>
      </div>

      <div class="ex-bar-main">
        <button class="btn btn-soft ex-prev" data-action="prev" aria-label="Eine Übung zurück">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        </button>
        <button class="btn btn-soft ex-prev ex-stop" data-action="stop"
                aria-label="Einheit abbrechen" title="Abbrechen" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
        <button class="btn btn-primary ex-next" data-action="next">
          <span data-slot="step"></span>
          Weiter
        </button>
      </div>
    </div>
  </section>
</template>

<!-- ------------------------------------------------- Abschluss -->
<template id="screen-done">
  <section class="screen screen-done">
    <p class="cheer" data-slot="cheer" hidden aria-hidden="true">🎉</p>
    <p class="eyebrow" data-slot="eyebrow">Geschafft</p>
    <h1 data-slot="headline"></h1>
    <p class="note" data-slot="hint" hidden></p>

    <!-- Wer über einen Link hier ist, schuldet der Person zwei Sachen:
         eine Rückmeldung und beim nächsten Mal den Push. -->
    <p class="pushback" data-slot="pushback" hidden></p>

    <div class="pair" data-slot="pair"></div>
    <p class="note" data-slot="sharehow"></p>

    <div class="share" data-slot="share"></div>

    <!-- Konfetti sitzt in einer Zeile ohne Höhe, damit der Ausbruch nichts verschiebt. -->
    <div class="party" data-slot="party" hidden aria-hidden="true"></div>
    <!-- Die Meldung steht erst da, wenn sie etwas zu sagen hat. Leer hielte
         sie nur eine Zeile frei, die niemand liest. -->
    <p class="status" data-slot="status" role="status" hidden></p>

    <!-- Nach dem Push nur noch eine leise Zeile, kein zweiter Aufruf. -->
    <p class="sidequest" data-slot="sidequest" hidden>
      <span data-slot="sidenote"></span>
      <button class="linkbtn" data-action="side">Noch eine Person</button>
    </p>

    <button class="btn btn-quiet" data-action="home">Zurück zur Übersicht</button>

    <!-- Zahlen kommen nach dem Push-Moment, nicht davor. -->
    <div class="stats">
      <div class="week" data-slot="week" role="img" data-label=""></div>
      <p class="weekline" data-slot="weekline"></p>
      <p class="note weekmore" data-slot="weekmore"></p>
      <p class="note" data-slot="streak"></p>
    </div>
  </section>
</template>

<!-- ------------------------------------------------- Alle Übungen -->
<template id="screen-library">
  <section class="screen screen-library">
    <div class="topbar">
      <button class="linkbtn linkbtn-lead" data-action="back">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
        Zurück
      </button>
      <p class="eyebrow" data-slot="count"></p>
    </div>
    <h1>Alle Übungen</h1>
    <p class="note" data-slot="lead"></p>
    <div class="exercise-list" data-slot="list"></div>
  </section>
</template>

<!-- ------------------------------------------------- Übung bearbeiten -->
<script type="module" src="app.js"></script>
</body>
</html>
